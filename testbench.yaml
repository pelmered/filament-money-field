
providers:
    - "Pelmered\\LaraPara\\LaraParaServiceProvider"
    - "Workbench\\App\\Providers\\DemoPanelProvider"

# Reuses the suite's own posts migration and Post model, so the demo panel and
# the tests exercise the same schema.
migrations:
    - tests/Support/Database/Migrations

seeders:
    - "Workbench\\Database\\Seeders\\DatabaseSeeder"

workbench:
  start: '/admin'
  install: true
  discovers:
    web: true
    api: false
    commands: false
    components: false
    views: false
    config: true

  build:
    - create-sqlite-db
    - migrate:refresh
    - filament:assets
