
name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      # One failing combination should not cancel the rest; otherwise a single
      # platform-specific failure hides the state of every other job.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        php: [8.2, 8.3, 8.4]
        filament: ['^4.0', '^5.0']
        stability: [prefer-lowest, prefer-stable]

    name: P${{ matrix.php }} - F${{ matrix.filament }} - ${{ matrix.stability }} - ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, fileinfo, zip, pdo, sqlite, pdo_sqlite, bcmath

      - name: Pin Filament version
        # bash on every OS: under PowerShell, composer.bat goes through cmd.exe,
        # which treats ^ as an escape character and strips it from the constraint.
        shell: bash
        run: composer require "filament/filament:${{ matrix.filament }}" --dev --no-update --no-interaction

      - name: Drop the browser test plugin
        # This matrix does not run the Browser suite, and the plugin requires
        # PHP >= 8.3, which would fail to resolve on the 8.2 jobs. Browser tests
        # run in the dedicated "browser" job below.
        shell: bash
        run: composer remove --dev pestphp/pest-plugin-browser --no-update --no-interaction

      - name: Install dependencies
        run: composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: Execute tests
        run: vendor/bin/pest --exclude-testsuite=Browser

  browser:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Browser tests run against every supported Filament major. PHP is pinned
        # to 8.4 because pest-plugin-browser requires >= 8.3.
        filament: ['^4.0', '^5.0']

    name: Browser - F${{ matrix.filament }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          # ext-sockets is required by pestphp/pest-plugin-browser.
          extensions: intl, fileinfo, zip, pdo, sqlite, pdo_sqlite, bcmath, sockets
          coverage: none

      - name: Pin Filament version
        shell: bash
        run: composer require "filament/filament:${{ matrix.filament }}" --dev --no-update --no-interaction

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Playwright
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Execute browser tests
        run: composer test:browser

  report-metrics:
    runs-on: ubuntu-latest
    # Reporting only. Coverage thresholds and the upload depend on an external
    # service, so a failure here must not fail the build.
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: intl, fileinfo, zip, pdo, sqlite, pdo_sqlite, bcmath
          coverage: pcov

      - name: Install dependencies
        run: composer install --no-interaction

      - name: Setup testbench
        run: php vendor/bin/testbench package:purge-skeleton --ansi

      - name: Execute tests with coverage
        run: vendor/bin/pest --exclude-testsuite=Browser --coverage-clover=reports/coverage/test-coverage-clover.xml

      - name: Execute type coverage tests
        run: vendor/bin/pest --exclude-testsuite=Browser --type-coverage --type-coverage-json=reports/coverage/pest-types-coverage.json

      - name: Upload Coverage Reports
        env:
          OTTERWISE_TOKEN: ${{ secrets.OTTERWISE_TOKEN }}
        run: bash <(curl -s https://raw.githubusercontent.com/getOtterWise/bash-uploader/main/uploader.sh) --file reports/coverage/test-coverage-clover.xml --type-coverage-file reports/coverage/pest-types-coverage.json
